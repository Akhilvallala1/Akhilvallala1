<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Akhil Vallala, Lead Machine Learning Engineer. LLM gateways, guardrails, PII redaction and evals.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#111a33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#5eead4"/>
    </marker>
  </defs>

  <rect width="1280" height="320" rx="16" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="16" fill="url(#grid)"/>
  <rect x="64" y="246" width="96" height="4" rx="2" fill="url(#accent)"/>

  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="64" y="118" fill="#f8fafc" font-size="56" font-weight="700" letter-spacing="-1">Akhil Vallala</text>
    <text x="64" y="166" fill="#cbd5e1" font-size="26" font-weight="500">Lead Machine Learning Engineer</text>
    <text x="64" y="214" fill="#94a3b8" font-size="20">LLM gateways · guardrails · PII redaction · evals</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
    <!-- callers -->
    <g fill="#cbd5e1">
      <rect x="700" y="84" width="118" height="34" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="759" y="106" text-anchor="middle">agents</text>
      <rect x="700" y="143" width="118" height="34" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="759" y="165" text-anchor="middle">apps</text>
      <rect x="700" y="202" width="118" height="34" rx="8" fill="#1e293b" stroke="#334155"/>
      <text x="759" y="224" text-anchor="middle">users</text>
    </g>

    <!-- arrows in -->
    <g stroke="#5eead4" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-opacity="0.85">
      <path d="M818 101 C852 101 852 160 884 160"/>
      <path d="M818 160 L884 160"/>
      <path d="M818 219 C852 219 852 160 884 160"/>
    </g>

    <!-- gateway -->
    <rect x="888" y="74" width="190" height="172" rx="12" fill="#0f172a" stroke="url(#accent)" stroke-width="2"/>
    <text x="983" y="104" text-anchor="middle" fill="#f8fafc" font-weight="700">gateway</text>
    <g fill="#94a3b8">
      <text x="912" y="140">› route</text>
      <text x="912" y="168">› redact PII</text>
      <text x="912" y="196">› guard</text>
      <text x="912" y="224">› eval</text>
    </g>

    <!-- arrow out -->
    <path d="M1078 160 L1130 160" stroke="#818cf8" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- models -->
    <rect x="1134" y="114" width="96" height="92" rx="10" fill="#1e293b" stroke="#334155"/>
    <text x="1182" y="156" text-anchor="middle" fill="#cbd5e1">models</text>
    <text x="1182" y="180" text-anchor="middle" fill="#64748b" font-size="12">any vendor</text>
  </g>
</svg>
